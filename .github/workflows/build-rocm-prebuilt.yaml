      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push vllm image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:service/therock-vllm"
          push: true
          tags: |
            ghcr.io/chaserhkj/containers/vllm-gfx110x:latest
            ghcr.io/chaserhkj/containers/vllm-gfx110x:${{ env.ADDITIONAL_TAG }}
          file: Containerfile
          build-args: |
