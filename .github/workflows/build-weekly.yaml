          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:service/git-caddy"
          file: Containerfile
          push: true
          tags: |
            ghcr.io/chaserhkj/containers/git-caddy
            ghcr.io/chaserhkj/containers/git-caddy:${{ needs.timestamp.outputs.timestamp }}

  build-democratic-csi:
    name: Build the democratic-csi service image with updated tools
    needs: [timestamp]
