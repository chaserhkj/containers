name: Build some service container images weekly

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-weekly.yaml'
      - 'service/git-server/**'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 2,5'

permissions:
  contents: read
  packages: write

jobs:
  timestamp:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.set-ts.outputs.ts }}
    steps:
      - id: set-ts
        run: echo "ts=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

  build-git-server:
    name: Build the git-server service image 
    needs: [timestamp]
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push therock rocm base image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:service/git-server"
          file: Containerfile
          push: true
          tags: |
            ghcr.io/chaserhkj/containers/git-server
            ghcr.io/chaserhkj/containers/git-server:${{ needs.timestamp.outputs.timestamp }}