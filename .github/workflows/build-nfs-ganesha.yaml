name: Build nfs-ganesha image

on:
  push:
    branches: 
      - main
    paths:
      - '.github/workflows/build-nfs-ganesha.yaml'
      - 'flake.lock'
      - 'flake.nix'
      - 'nix/lib/**'
      - 'nix/services/nfs-ganesha.nix'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-nfs-ganesha:
    name: Build nfs-ganesha image using nix2container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install nix
        uses: cachix/install-nix-action@v31
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build using nix2container
        run: |
          nix build -vL .#ganeshaConfigured
          nix run .#nfs-ganesha.copyToRegistry