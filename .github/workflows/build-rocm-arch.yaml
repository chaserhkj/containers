name: Build ROCm stack images for a single GPU architecture

on:
  workflow_call:
    inputs:
      gpu_arch:
        description: GPU architecture passed to the GPU_ARCH build arg (e.g. gfx103X)
        required: true
        type: string
      image_suffix:
        description: Lowercase suffix used in image names and tags (e.g. gfx103x)
        required: true
        type: string
      additional_tag:
        description: Tag suffix applied to every image in addition to :latest
        required: true
        type: string
      build_vllm:
        description: Whether to build the vllm image (disabled for arches with no prebuilt vllm packages)
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-llama-server:
    name: Build the llama server image for ${{ inputs.gpu_arch }} devices
    runs-on: ubuntu-latest
    env:
      ADDITIONAL_TAG: ${{ inputs.additional_tag }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push llama.cpp image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:service/therock-llama-cpp"
          push: true
          tags: |
            ghcr.io/chaserhkj/containers/llama-server-${{ inputs.image_suffix }}:latest
            ghcr.io/chaserhkj/containers/llama-server-${{ inputs.image_suffix }}:${{ env.ADDITIONAL_TAG }}
          file: Containerfile
          build-args: |
            GPU_ARCH=${{ inputs.gpu_arch }}

  build-sd-cpp:
    name: Build the sd.cpp image for ${{ inputs.gpu_arch }} devices
    runs-on: ubuntu-latest
    env:
      ADDITIONAL_TAG: ${{ inputs.additional_tag }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push sd.cpp image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:service/therock-sd-cpp"
          push: true
          tags: |
            ghcr.io/chaserhkj/containers/sd-cpp-${{ inputs.image_suffix }}:latest
            ghcr.io/chaserhkj/containers/sd-cpp-${{ inputs.image_suffix }}:${{ env.ADDITIONAL_TAG }}
          file: Containerfile
          build-args: |
            GPU_ARCH=${{ inputs.gpu_arch }}

  build-audio-cpp:
    name: Build the audio.cpp image for ${{ inputs.gpu_arch }} devices
    runs-on: ubuntu-latest
    env:
      ADDITIONAL_TAG: ${{ inputs.additional_tag }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push audio.cpp image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:service/therock-audio-cpp"
          push: true
          tags: |
            ghcr.io/chaserhkj/containers/audio-cpp-${{ inputs.image_suffix }}:latest
            ghcr.io/chaserhkj/containers/audio-cpp-${{ inputs.image_suffix }}:${{ env.ADDITIONAL_TAG }}
          file: Containerfile
          build-args: |
            GPU_ARCH=${{ inputs.gpu_arch }}

  build-ggml-engines:
    name: Build the ggml engines image for ${{ inputs.gpu_arch }} devices
    runs-on: ubuntu-latest
    needs: [build-llama-server, build-sd-cpp, build-audio-cpp]
    env:
      ADDITIONAL_TAG: ${{ inputs.additional_tag }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push ggml engines image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:service/therock-ggml-engines"
          push: true
          tags: |
            ghcr.io/chaserhkj/containers/ggml-engines-${{ inputs.image_suffix }}:latest
            ghcr.io/chaserhkj/containers/ggml-engines-${{ inputs.image_suffix }}:${{ env.ADDITIONAL_TAG }}
          build-contexts: |
            therock-sd-cpp=docker-image://ghcr.io/chaserhkj/containers/sd-cpp-${{ inputs.image_suffix }}:latest
            therock-audio-cpp=docker-image://ghcr.io/chaserhkj/containers/audio-cpp-${{ inputs.image_suffix }}:latest
            therock-llama-cpp=docker-image://ghcr.io/chaserhkj/containers/llama-server-${{ inputs.image_suffix }}:latest
          file: Containerfile

  build-vllm:
    if: inputs.build_vllm
    name: Build the vllm image for ${{ inputs.gpu_arch }} devices
    runs-on: ubuntu-latest
    env:
      ADDITIONAL_TAG: ${{ inputs.additional_tag }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push vllm image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:service/therock-vllm"
          push: true
          tags: |
            ghcr.io/chaserhkj/containers/vllm-${{ inputs.image_suffix }}:latest
            ghcr.io/chaserhkj/containers/vllm-${{ inputs.image_suffix }}:${{ env.ADDITIONAL_TAG }}
          file: Containerfile
          build-args: |
            GPU_ARCH=${{ inputs.gpu_arch }}
