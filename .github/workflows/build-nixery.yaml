name: Build nixery container images weekly

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-nixery.yaml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 2,5'

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: "chaserhkj/nixery"
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -ex
          nix-build -A nixery-image -o image.tar.gz
          LOAD_OUTPUT=$(docker load -i image.tar.gz)
          IMAGE_REF=$(echo $LOAD_OUTPUT | awk -F " " '{print $3}')
          TS=$(date +'%Y%m%d%H%M')
          docker tag $IMAGE_REF ghcr.io/chaserhkj/containers/nixery:$TS
          docker tag $IMAGE_REF ghcr.io/chaserhkj/containers/nixery:latest
          docker push ghcr.io/chaserhkj/containers/nixery:$TS
          docker push ghcr.io/chaserhkj/containers/nixery:latest